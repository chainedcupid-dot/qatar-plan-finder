name: Price robot

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 6:17 am Qatar time
  workflow_dispatch:        # lets you press "Run" by hand
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency: { group: robot, cancel-in-progress: false }

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

      - name: Read today's prices
        id: robot
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run robot

      - name: Save new prices
        if: github.event_name != 'push'
        run: |
          git config user.name "price-robot"
          git config user.email "price-robot@users.noreply.github.com"
          git add plans.json
          git diff --cached --quiet || git commit -m "Prices checked $(date -u +%F)"
          git push

      - name: Pack the website
        run: mkdir _site && cp index.html plans.json config.json manifest.json icon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Ring the alarm (opens an issue, GitHub emails you)
        if: steps.robot.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create robot-alarm --color B60205 --force || true
          open=$(gh issue list --label robot-alarm --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "🤖 Price robot is confused" --label robot-alarm --body-file robot-report.md
          else
            gh issue comment "$(gh issue list --label robot-alarm --state open --json number --jq '.[0].number')" --body-file robot-report.md
          fi

      - name: Close the alarm once things work again
        if: steps.robot.outcome == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create robot-alarm --color B60205 --force || true
          for n in $(gh issue list --label robot-alarm --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed itself, prices read fine today. ✅"
          done
