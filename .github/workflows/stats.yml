# Copies the visitor counter into a plain text file (branch "stats"), every hour.
# Lets Claude read your numbers without screenshots. Needs the GC_API secret (a GoatCounter API key).
name: stats
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: true
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Read the counter
        env:
          GC_API: ${{ secrets.GC_API }}
          GC_CODE: chained-cupid
        run: |
          set -e
          if [ -z "$GC_API" ]; then echo "No GC_API secret, skipping"; exit 0; fi
          mkdir s && cd s
          python3 - <<'EOF'
          import json, os, time, urllib.request, urllib.parse, datetime as dt
          key, base = os.environ["GC_API"], f"https://{os.environ['GC_CODE']}.goatcounter.com/api/v0"
          qa = dt.timezone(dt.timedelta(hours=3)); now = dt.datetime.now(qa)
          def get(path, **q):
              url = base + path + ("?" + urllib.parse.urlencode(q) if q else "")
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
              for _ in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code == 429: time.sleep(3); continue
                      return {"error": f"HTTP {e.code}: {e.read()[:200].decode(errors='replace')}"}
                  except Exception as e: return {"error": str(e)}
                  finally: time.sleep(0.4)
              return {"error": "rate limited"}
          def iso(d): return d.astimezone(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          today0 = now.replace(hour=0, minute=0, second=0, microsecond=0)
          periods = [("TODAY (since midnight Qatar time)", today0), ("LAST 7 DAYS", today0 - dt.timedelta(days=6)), ("LAST 30 DAYS", today0 - dt.timedelta(days=29))]
          out = [f"# Baqat Qatar visitor stats\nUpdated {now:%Y-%m-%d %H:%M} (Qatar time)\n"]
          for title, start in periods:
              q = dict(start=iso(start), end=iso(now))
              out.append(f"\n## {title}\n")
              tot = get("/stats/total", **q)
              if "error" in tot: out.append(f"total: {tot['error']}\n")
              else:
                  out.append(f"Visits: {tot.get('total')}   Events: {tot.get('total_events')}\n")
                  days = [(s.get('day'), s.get('daily')) for s in tot.get('stats', [])]
                  if len(days) > 1: out.append("Per day: " + ", ".join(f"{d}={n}" for d, n in days) + "\n")
                  elif days and tot['stats'][0].get('hourly'):
                      h = tot['stats'][0]['hourly']; out.append("Per hour (UTC): " + " ".join(f"{i}h={n}" for i, n in enumerate(h) if n) + "\n")
              hits = get("/stats/hits", limit=100, **q)
              if "error" in hits: out.append(f"pages: {hits['error']}\n")
              else:
                  out.append("\n### Pages and events\n")
                  for h in hits.get("hits", []):
                      out.append(f"- {h.get('count')}  {h.get('path')}{'  (event)' if h.get('event') else ''}\n")
              for page in ("toprefs", "locations", "systems", "browsers", "sizes"):
                  r = get(f"/stats/{page}", limit=15, **q)
                  out.append(f"\n### {page}\n")
                  if "error" in r: out.append(r["error"] + "\n"); continue
                  for s in r.get("stats", []): out.append(f"- {s.get('count')}  {s.get('name') or '(unknown)'}\n")
          open("stats.md", "w").write("".join(out).replace(key, "***"))
          EOF
          git init -q && git checkout -q -b stats
          git add stats.md
          git -c user.name="stats-robot" -c user.email="stats-robot@users.noreply.github.com" commit -qm "stats $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" stats
          echo "Saved."
