  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --sand:#e4c07a; --sand-tint:#2b2516;

  --ooredoo:#ff6b78; --vodafone:#c3c8cd; color-scheme:dark}}

body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}

 prepaid:{light:{data:4,mins:120,dest:"none",intl:0},regular:{data:12,mins:300,dest:"none",intl:0},heavy:{data:30,mins:900,dest:"none",intl:0},
  home:{data:8,mins:200,dest:"in",intl:150}},
 data:{light:{data:10,abroad:"none"},home:{data:150,abroad:"none"},heavy:{data:400,abroad:"none"},travel:{data:40,abroad:"gcc"}}
};
const DEFAULT_PRESET = {monthly:"regular",prepaid:"regular",data:"home"};
const DATA_MAX = {monthly:200,prepaid:100,data:500};
const CURRENT_DEFAULT = {monthly:"none",prepaid:"none",data:"none"};
let L = "en", TAB = "monthly", showAll = false;
const ST = {};
for(const t of ["monthly","prepaid","data"]) ST[t] = {...{data:25,mins:400,dest:"none",intl:0,trip:"none",roam:0,abroad:"none"}, ...PRESETS[t][DEFAULT_PRESET[t]], preset:null, current:CURRENT_DEFAULT[t], custom:150, started:false};
// Returning visitors go straight to their result
try{ const saved = JSON.parse(localStorage.getItem("qpf-st")||"null"); if(saved) for(const t in ST) if(saved[t] && saved[t].started) Object.assign(ST[t], saved[t]); }catch(e){}
const saveST = () => { try{ localStorage.setItem("qpf-st", JSON.stringify(ST)); }catch(e){} };
try{ const s = localStorage.getItem("qpf-lang"); if(T[s]) L=s; const tb = localStorage.getItem("qpf-tab"); if(ST[tb]) TAB=tb; }catch(e){}
if(/^#(monthly|prepaid|data)$/.test(location.hash)) TAB = location.hash.slice(1);
const $ = id => document.getElementById(id);

const URLS = {shahry:"https://www.ooredoo.qa/web/en/postpaid-plans/shahry/",qatarna:"https://www.ooredoo.qa/web/en/postpaid-plans/qatarna/",
 hala:"https://www.ooredoo.qa/web/en/prepaid-plans/recharge/",datasim:"https://www.ooredoo.qa/web/en/postpaid-plans/data-sim/",
 postpaid:"https://www.vodafone.qa/Postpaid-Plus-Plans",unlimited:"https://www.vodafone.qa/Unlimited-Plus-Plans"};
function planUrl(pl){
 let u = null;
 if(pl.p==="o") u = pl.n.startsWith("Shahry")?URLS.shahry : pl.n.startsWith("Qatarna")?URLS.qatarna : pl.n.startsWith("Data SIM")?URLS.datasim : URLS.hala;
 else if(pl.n.startsWith("Postpaid+")) u = URLS.postpaid; else if(pl.n.startsWith("Unlimited+")) u = URLS.unlimited;
 return u && L==="ar" ? u.replace("/web/en/","/web/ar/") : u;
}

// ===================== SHARE LINKS =====================
// A shared link carries the sender's settings, so the friend opens the same result they saw.
const KEYS = {d:"data",m:"mins",c:"dest",i:"intl",v:"trip",r:"roam",a:"abroad",p:"current",x:"custom"};
function shareLink(){
 const s = ST[TAB], q = new URLSearchParams({t:TAB, l:L});
 const skip = {c:s.dest==="none", i:s.dest==="none", v:TAB!=="monthly"||s.trip==="none", r:TAB!=="monthly"||s.trip==="none",
   a:TAB!=="data"||s.abroad==="none", m:TAB==="data", x:s.current!=="other", p:s.current==="none"};
 for(const [k,f] of Object.entries(KEYS)) if(!skip[k] && s[f]!==undefined && s[f]!=="") q.set(k, s[f]);
 return location.origin + location.pathname + "?" + q.toString();
}
try{
 const q = new URLSearchParams(location.search);
 if(q.has("t") && ST[q.get("t")]){
  TAB = q.get("t"); if(T[q.get("l")]) L = q.get("l");
  const s = ST[TAB]; s.preset = null; s.started = true;
  for(const [k,f] of Object.entries(KEYS)) if(q.has(k)){ const v = q.get(k); s[f] = /^-?\d+(\.\d+)?$/.test(v) ? Number(v) : v; }
 }
}catch(e){}

// ===================== MATH =====================
const isRecharge = pl => pl.days !== undefined;
const intlOf = (pl,d) => pl.intl ? (pl.intl[d] ?? pl.intl[{bd:"in",pk:"ph",np:"any"}[d]] ?? 0) : 0;
function yearCost(pl){
 if(isRecharge(pl)) return Math.round(pl.price*365/pl.days);
 const m = Math.min(pl.pm,12); return pl.promo*m + pl.std*(12-m);
}
function currentYearCost(pl){ return isRecharge(pl) ? yearCost(pl) : pl.std*12; }
function evaluate(pl, s){
 const fails = [];
 const k = isRecharge(pl) ? pl.days/30 : 1;   // how much of a month one pack covers
 const need = {data:s.data*k, mins:s.mins*k, intl:s.intl*k, roam:s.roam};
 if(pl.pool){
  const units = need.data*pl.gb + need.mins + (s.dest!=="none" ? need.intl*FLEX_RATE[s.dest] : 0);
  if(units > pl.pool) fails.push("pool");
  return fails;
 }
 if(pl.data < need.data) fails.push("data");
 if(TAB==="data"){ if(s.abroad!=="none" && !(pl.abroad[s.abroad]>0)) fails.push("abroad"); return fails; }
 if(pl.mins < need.mins) fails.push("mins");
 if(s.dest!=="none" && intlOf(pl,s.dest) < need.intl) fails.push("intl");
 if(TAB==="monthly" && s.trip!=="none" && s.roam>0 && pl.roam[s.trip] < s.roam) fails.push("roam");
 return fails;
}

// ===================== UI =====================
function readControls(){
 const s = ST[TAB];
 for(const k of ["data","mins","intl","roam"]) s[k] = +$(k).value;
 for(const k of ["dest","trip","abroad","current"]) s[k] = $(k).value;
 s.custom = +$("custom").value || 0;
}
function writeControls(){
 const s = ST[TAB];
 $("data").max = DATA_MAX[TAB];
 for(const k of ["data","mins","intl","roam","dest","trip","abroad","current"]) $(k).value = s[k];
 $("custom").value = s.custom;
}
function fillSelects(){
 const t = T[L];
 const opts = o => Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
 $("dest").innerHTML = opts(t.dests); $("trip").innerHTML = opts(t.trips); $("abroad").innerHTML = opts(t.abroads);
 const list = DB[TAB];
 const price = p => isRecharge(p) ? `${t.qr} ${p.price}` : `${t.qr} ${p.std}`;
 const grp = (pv,label) => `<optgroup label="${label}">${list.filter(p=>p.p===pv).map(p=>`<option value="${p.n}">${p.n} · ${price(p)}</option>`).join("")}</optgroup>`;
 $("current").innerHTML = `<option value="none">${t.noneYet}</option>` + grp("o","Ooredoo") + grp("v","Vodafone") + `<option value="other">${t.other}</option>`;
}
function applyLang(){
 const t = T[L];
 document.documentElement.lang = L; document.documentElement.dir = t.dir;
 $("lang").innerHTML = LANG_ORDER.map(k=>`<option value="${k}">${T[k].langName}</option>`).join(""); $("lang").value = L; $("langcode").textContent = {en:"EN",ar:"ع",hi:"हि",ur:"UR",bn:"বাং",ml:"മല",ne:"ने",fil:"FIL"}[L];
 $("t-brand").textContent = t.brand; $("t-brand2").textContent = t.brand2;
 $("t-title").textContent = t.title; $("t-sub").textContent = t.sub;
 for(const k of ["monthly","prepaid","data"]){ const b=$("tab-"+k); b.textContent=t.tabs[k]; b.setAttribute("aria-selected",String(k===TAB)); }
 $("tabnote").textContent = t.tabnote[TAB];
 for(const k of ["tap","tune","step2","data","mins","dest","intl","trip","roam","abroad","custom","hint"]) $("t-"+k).textContent = t[k];
 $("t-q1").textContent = t.q1[TAB];
 $("t-current").textContent = t.current[TAB];
 document.querySelectorAll("[data-on]").forEach(el=>{ el.hidden = !el.dataset.on.split(" ").includes(TAB); });
 const pr = PRESETS[TAB], s = ST[TAB];
 const IC = {light:"🌱",regular:"📱",heavy:"🔥",home:TAB==="data"?"🏠":"📞",travel:"✈️"}; if(TAB==="data") IC.heavy="🎬";
 const n = v => v.toLocaleString(L==="ar"?"ar-QA":"en");
 $("presets").innerHTML = Object.keys(pr).map(k=>{ const p = pr[k];
   const d = TAB==="data" ? `${n(p.data)} ${t.gb}` : `${n(p.data)} ${t.gb} · ${n(p.mins)} ${t.min}`;
   return `<button type="button" class="preset" data-p="${k}" aria-pressed="${s.preset===k}"><span class="ic" aria-hidden="true">${IC[k]}</span><b>${t.presets[TAB][k]}</b><small>${d}</small></button>`; }).join("");
 $("t-checked").textContent = t.checked(new Date(CHECKED+"T12:00:00")); $("t-src").innerHTML = t.src; 
 fillSelects(); writeControls(); render();
}

function render(){
 const t = T[L], s = ST[TAB];
 $("after").hidden = !s.started;
 document.body.classList.toggle("step1-only", !s.started);
 $("step2").classList.toggle("ask", s.started && s.current==="none");
 if(s.started) saveST();
 const num = v => (Math.round(v*10)/10).toLocaleString(L==="ar"?"ar-QA":"en");
 const max = DATA_MAX[TAB];
 $("data-v").textContent = (s.data>=max ? `${num(max)}+` : num(s.data)) + " " + t.gb;
 $("mins-v").textContent = `${num(s.mins)} ${t.min}`;
 $("intl-v").textContent = s.dest==="none" ? "—" : `${num(s.intl)} ${t.min}`;
 $("roam-v").textContent = s.trip==="none" ? "—" : `${num(s.roam)} ${t.gb}`;
 $("intl").disabled = s.dest==="none"; $("roam").disabled = s.trip==="none";
 $("custom-wrap").hidden = s.current!=="other";

 const rows = DB[TAB].map(pl=>({pl, fails:evaluate(pl,s), yr:yearCost(pl)}));
 const fit = rows.filter(r=>!r.fails.length).sort((a,b)=>a.yr-b.yr);
 const miss = rows.filter(r=>r.fails.length).sort((a,b)=>a.fails.length-b.fails.length||a.yr-b.yr);

 // Verdict
 const curPlan = DB[TAB].find(p=>p.n===s.current);
 const hasNow = s.current!=="none";
 const curYear = curPlan ? currentYearCost(curPlan) : s.custom*12;
 const curFits = curPlan ? !evaluate(curPlan,s).length : true;
 const v = $("verdict"), best = fit[0];
 if(!best){ v.className="verdict"; v.innerHTML=`<strong>${t.vNone}</strong><p>${t.vNoneBody}</p>`; }
 else{
  const save = curYear - best.yr;
  const costOf = pl => isRecharge(pl) ? `${t.qr} ${num(pl.price)} ${t.every(pl.days)}` : t.yr(yearCost(pl));
  const curName = curPlan ? curPlan.n : `${t.qr} ${num(s.custom)}${t.mo}`;
  let msg;
  if(hasNow && (best.pl.n===s.current || (save<=0 && curFits))){
   msg = t.sh.good(curName);
   const alt = fit.find(r=>r.pl.n!==s.current) || best;
   v.className="verdict good"; v.innerHTML=`<strong>${t.vGood}</strong><p>${t.vGoodBody(alt.pl.n)}</p>`;
  } else if(hasNow && save>0){
   const mnp = curPlan && curPlan.p!==best.pl.p ? `<p class="mnp">${t.mnp}</p>` : "";
   msg = t.sh.save(curName, best.pl.n, num(Math.round(save)), num(isRecharge(best.pl) ? best.pl.price : best.pl.std));
   v.className="verdict"; v.innerHTML=`<strong>${t.vSaveHead}</strong><p>${t.vSave(best.pl.n, Math.round(save))}</p>${mnp}`;
  } else {
   const cost = costOf(best.pl);
   msg = t.sh.pick(best.pl.n, cost);
   v.className="verdict"; v.innerHTML=`<strong>${t.vPick}</strong><p>${t.vPickBody(best.pl.n, cost)}</p>`;
  }
  const wa = "https://wa.me/?text="+encodeURIComponent(`${msg}\n\n${t.sh.cta}\n${shareLink()}`);
  v.insertAdjacentHTML("beforeend",`<a class="share" href="${wa}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>${t.share}</a>`);
 }

 // How each option compares with what you pay now (a full year, promos included)
 const deltaChip = r => {
  if(!hasNow) return "";
  if(r.pl.n===s.current) return `<span class="delta yours">${t.dl.yours}</span>`;
  const d = Math.round(curYear - r.yr);
  if(Math.abs(d) < 60) return `<span class="delta same">${t.dl.same}</span>`;
  return d > 0 ? `<span class="delta save">${t.dl.save(num(d))}</span>` : `<span class="delta more">${t.dl.more(num(-d))}</span>`;
 };
 const card = (r,i,isFit) => {
  const pl=r.pl, f=r.fails, c=t.chip, rc=isRecharge(pl);
  const chips = [];
  const cls = k => f.includes(k) ? " short" : "";
  if(pl.pool){
   chips.push(`<span class="chip${cls("pool")}">${c.pool(num(pl.pool),pl.gb)}</span>`);
  } else {
   chips.push(`<span class="chip${cls("data")}">${!rc && pl.data>=125 && TAB==="monthly" ? c.dataU(num(pl.data)) : c.data(num(pl.data))}</span>`);
   if(TAB!=="data") chips.push(`<span class="chip${cls("mins")}">${c.mins(pl.mins)}</span>`);
   if(TAB!=="data" && s.dest!=="none") chips.push(`<span class="chip${cls("intl")}">${c.intl(intlOf(pl,s.dest))}</span>`);
   if(TAB==="monthly" && s.trip!=="none"){ const rv=pl.roam[s.trip]; chips.push(`<span class="chip${cls("roam")}">${rv?c.roam(rv):c.noRoam}</span>`); }
   if(TAB==="data" && s.abroad!=="none"){ const av=pl.abroad[s.abroad]; chips.push(`<span class="chip${cls("abroad")}">${av?c.abroadOk(av):c.abroadNo}</span>`); }
  }
  if(pl.after){
   const spd = pl.after>=1000 ? `${pl.after/1000} Mbps` : `${pl.after} Kbps`;
   const q = t.speedQ[pl.after<=128?0 : pl.after<=512?1 : pl.after<=2000?2 : 3];
   chips.push(`<span class="chip">${c.after(spd,q)}</span>`);
  }
  pl.perks.filter(k=>!["bill","endless","after1"].includes(k)).forEach(k=>chips.push(`<span class="chip">${t.perks[k]}</span>`));
  const price = rc
   ? `<b>${t.qr} ${num(pl.price)}</b><small>${t.every(pl.days)}</small><small>${t.yrR(r.yr)}</small>`
   : `<b>${t.qr} ${num(pl.std)}</b>${t.mo}<small>${t.yr(r.yr)}</small>`;
  const kind = TAB==="data" ? `<span class="kind">${rc?t.kind.recharge:t.kind.bill}</span>` : "";
  const tag = isFit ? (i===0 ? `<span class="tag top"><i>★ ${t.cheapest}</i></span>` : `<span class="tag">${t.fits}</span>`) : `<span class="tag bad">${t.short}</span>`;
  const url = planUrl(pl);
  return `<article class="plan${isFit&&i===0?" best":""}${isFit?"":" miss"}">
   <div><div class="prov ${pl.p}">${pl.p==="o"?"Ooredoo":"Vodafone"}</div><h3 class="pname">${pl.n}${kind}</h3></div>
   <div class="price">${price}</div>
   <div class="tagrow">${tag}${deltaChip(r)}</div>${!rc && pl.pm ? `<div class="promo">${t.then(num(pl.promo),num(pl.pm),num(pl.std))}</div>` : ""}
   <div class="specs">${chips.join("")}</div>
   ${isFit && url ? `<a class="go" href="${url}" target="_blank" rel="noopener">${t.go(pl.p)}</a>` : ""}</article>`;
 };
 $("list").innerHTML = fit.map((r,i)=>card(r,i,true)).join("") + (showAll ? miss.map((r,i)=>card(r,i,false)).join("") : "");
 $("more").hidden = !miss.length;
 $("more").textContent = showAll ? t.less : t.more(num(miss.length));
}

// ===================== EVENTS =====================
// First choice on a tab: reveal step 2 and the results, and glide down to them.
function start(){
 const s = ST[TAB]; if(s.started) return;
 s.started = true; const a = $("after"); a.hidden = false; a.classList.remove("enter"); void a.offsetWidth; a.classList.add("enter");
 requestAnimationFrame(()=>$("step2").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}));
}
const clearPreset = () => { ST[TAB].preset = null; document.querySelectorAll(".preset").forEach(b=>b.setAttribute("aria-pressed","false")); };
["data","mins","intl","roam"].forEach(id=>$(id).addEventListener("input",()=>{readControls();clearPreset();render();}));
["data","mins","intl","roam"].forEach(id=>$(id).addEventListener("change",()=>{start();render();}));
["dest","trip","abroad"].forEach(id=>$(id).addEventListener("change",()=>{readControls();clearPreset();start();render();}));
$("current").addEventListener("change",()=>{readControls();render();
 if(ST[TAB].current!=="none") requestAnimationFrame(()=>$("verdict").scrollIntoView({behavior:"smooth",block:"nearest"}));});
$("custom").addEventListener("input",()=>{readControls();render();});
$("presets").addEventListener("click",e=>{
 const b=e.target.closest(".preset"); if(!b) return;
 Object.assign(ST[TAB], PRESETS[TAB][b.dataset.p], {preset:b.dataset.p});
 document.querySelectorAll(".preset").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
 writeControls(); start(); render();
});
$("tabs").addEventListener("click",e=>{
 const b=e.target.closest(".tab"); if(!b || b.dataset.tab===TAB) return;
 TAB=b.dataset.tab; showAll=false;
 try{localStorage.setItem("qpf-tab",TAB)}catch(err){}
 applyLang();
});
$("more").addEventListener("click",()=>{showAll=!showAll;render();});
$("lang").addEventListener("change",()=>{L=$("lang").value;try{localStorage.setItem("qpf-lang",L)}catch(e){}track(`lang/${L}`,`Language: ${L}`);applyLang();});
// Light / dark switch. Starts from the phone's setting; a tap overrides it and is remembered.
const SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>';
const MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>';
const isDark = () => { const a = document.documentElement.dataset.theme; return a ? a==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const paintThemeBtn = () => { const d = isDark(); $("theme").innerHTML = d ? SUN : MOON; $("theme").setAttribute("aria-label", d ? "Light mode" : "Dark mode"); };
try{ const th = localStorage.getItem("qpf-theme"); if(th==="dark"||th==="light") document.documentElement.dataset.theme = th; }catch(e){}
$("theme").addEventListener("click",()=>{ const next = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = next;
 try{localStorage.setItem("qpf-theme",next)}catch(e){} paintThemeBtn(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);
paintThemeBtn();
applyLang();

// ===================== ANONYMOUS COUNTER =====================
// Only runs on the public site, when config.json names a GoatCounter account. No cookies.
// Counts: page visits (automatic), tab switches, taps on "See it on ...", WhatsApp shares, language flips.
function track(path, title){
 try{ if(window.goatcounter && window.goatcounter.count) window.goatcounter.count({path, title: title||path, event:true}); }catch(e){}
}
const slug = s => s.toLowerCase().replace(/\+/g,"-plus").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
document.addEventListener("click",e=>{
 const go = e.target.closest("a.go");
 if(go){ const card = go.closest(".plan"); const n = card.querySelector(".pname").firstChild.textContent;
   const prov = card.querySelector(".prov").textContent.toLowerCase(); track(`go/${prov}/${slug(n)}`, `Opened ${n} on ${prov}`); return; }
 if(e.target.closest("a.share")){ track(`share/whatsapp/${TAB}`, `WhatsApp share (${TAB})`); return; }
 const tb = e.target.closest(".tab"); if(tb){ track(`tab/${tb.dataset.tab}`, `Tab: ${tb.dataset.tab}`); return; }
});
fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{
 const code = c && c.goatcounter;
 if(!code || !/^[a-z0-9-]{2,50}$/.test(code)) return;
 const sc = document.createElement("script");
 sc.async = true; sc.src = "https://gc.zgo.at/count.js"; sc.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
 document.head.appendChild(sc);
}).catch(()=>{});

// On the public site, the robot's price file (plans.json) sits next to this page and has the freshest prices.
fetch("plans.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
 if(!j) return;
 const inf = v => v===null ? U : v;
 const fixRoam = o => o && Object.fromEntries(Object.entries(o).map(([k,v])=>[k,inf(v)]));
 const fix = p => ({...p, mins:inf(p.mins), roam:fixRoam(p.roam), abroad:fixRoam(p.abroad)});
 if(Array.isArray(j.plans) && j.plans.length) DB.monthly = j.plans.map(fix);
 if(Array.isArray(j.prepaid) && j.prepaid.length) DB.prepaid = j.prepaid.filter(p=>!p.gone).map(fix);
 if(Array.isArray(j.data) && j.data.length) DB.data = j.data.filter(p=>!p.gone).map(fix);
 Object.values(DB).forEach(withAfter);
 if(j.checked) CHECKED = j.checked;
 applyLang();
}).catch(()=>{});
